[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "live-clipper"
version = "1.0.1"
description = "Venus: CLI pipeline for extracting highlight clips from livestream recordings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "live-clipper contributors"},
]
keywords = ["video", "clips", "livestream", "transcription", "ffmpeg", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "huggingface-hub==1.24.0",
  "modelscope-hub==0.1.8",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
  "socksio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/dingshuxin353/live-clipper"
Issues = "https://github.com/dingshuxin353/live-clipper/issues"
Documentation = "https://github.com/dingshuxin353/live-clipper#readme"

[project.optional-dependencies]
mlx = [
  "mlx-whisper>=0.4.2",
]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "twine>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
live-clipper = "live_clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live_clipper = [
  "prompts/*.md",
  "web_static/fonts/*.woff2",
  "web_static/fonts/*.pdf",
  "web_static/fonts/*.txt",
  "web_static/venus-mark.png",
  "web_static/react/*.html",
  "web_static/react/assets/*",
]
