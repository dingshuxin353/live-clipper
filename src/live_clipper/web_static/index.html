<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Clipper Web Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">LC</div>
        <div>
          <h1>Live Clipper</h1>
          <span class="version">Web Console V3</span>
        </div>
      </div>
      <nav class="tabs" aria-label="Console sections">
        <button class="tab active" data-tab="service">Service</button>
        <button class="tab" data-tab="runs">Runs</button>
        <button class="tab" data-tab="confirmations">Confirmations</button>
        <button class="tab" data-tab="logs">Logs</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>
      <div class="local-chip">127.0.0.1</div>
    </header>

    <main class="workspace">
      <section class="panel section active" id="section-service">
        <div class="panel-heading">
          <h2>Service</h2>
          <div class="button-row">
            <button id="refreshBtn" class="secondary-button">Refresh</button>
            <button id="startServiceBtn" class="primary-button">Start</button>
            <button id="stopServiceBtn" class="secondary-button">Stop</button>
            <button id="scanNowBtn" class="secondary-button">Scan Now</button>
          </div>
        </div>
        <div id="serviceMetrics" class="metrics-grid"></div>
        <div id="serviceSummary" class="info-grid"></div>
      </section>

      <section class="panel section" id="section-runs">
        <div class="panel-heading">
          <h2>Runs</h2>
          <div class="segmented" id="phaseFilters">
            <button class="active" data-phase="">all</button>
            <button data-phase="processing">processing</button>
            <button data-phase="needs_review">needs_review</button>
            <button data-phase="rendering">rendering</button>
            <button data-phase="rendered">rendered</button>
            <button data-phase="failed">failed</button>
          </div>
        </div>
        <div class="runs-layout">
          <div id="runList" class="run-list"></div>
          <div class="detail-panel">
            <div id="runDetail"></div>
            <div class="button-row detail-actions">
              <button id="renderRunBtn" class="primary-button" disabled>Render</button>
              <button id="cleanupPreviewBtn" class="secondary-button" disabled>Preview Cleanup</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel section" id="section-confirmations">
        <div class="panel-heading">
          <h2>Confirmations</h2>
          <div class="button-row">
            <button id="batchApproveBtn" class="danger-button">Approve Selected</button>
            <button id="batchRejectBtn" class="secondary-button">Reject Selected</button>
          </div>
        </div>
        <div id="confirmationList" class="confirmation-list"></div>
      </section>

      <section class="panel section" id="section-logs">
        <div class="panel-heading">
          <h2>Logs</h2>
          <button id="clearLogBtn" class="secondary-button">Clear</button>
        </div>
        <div id="eventStream" class="event-list"></div>
        <pre id="logOutput" class="log-output">Select a run to inspect logs.</pre>
      </section>

      <section class="panel section" id="section-settings">
        <div class="panel-heading">
          <h2>Settings</h2>
          <span class="muted">read only</span>
        </div>
        <div id="settingsView" class="info-grid"></div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="/static/app.js"></script>
  </body>
</html>
