<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowbg" cx="0.62" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#4a3877"/>
      <stop offset="1" stop-color="#171030"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9ae"/>
      <stop offset="1" stop-color="#e6b95c"/>
    </linearGradient>
    <filter id="tileshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tileclip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 底砖 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glowbg)" filter="url(#tileshadow)"/>

  <g clip-path="url(#tileclip)">
    <!-- 暗面星球 -->
    <circle cx="525.7" cy="539.5" r="219.7" fill="#4a3a72"/>
    <!-- 亮面相位 -->
    <path d="M 525.7 319.8 A 219.7 219.7 0 0 1 525.7 759.2 A 87.9 219.7 0 0 0 525.7 319.8 Z" fill="url(#gold)"/>
    <!-- 四芒星 -->
    <path d="M 333.5 251.1 L 354.1 319.7 L 422.7 340.3 L 354.1 360.9 L 333.5 429.6 L 312.9 360.9 L 244.2 340.3 L 312.9 319.7 Z" fill="url(#gold)"/>
  </g>
</svg>
