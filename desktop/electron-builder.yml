appId: com.dingshuxin.venus
productName: Venus
directories:
  output: dist-app
files:
  - main.js
  - preload.js
  - package.json
  - assets/**
extraResources:
  - from: backend-dist/live-clipper-backend
    to: backend
  - from: node_modules/ffmpeg-static/ffmpeg
    to: bin/ffmpeg
afterPack: ./scripts/after-pack.js
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.video
  icon: assets/icon.png
  identity: null
