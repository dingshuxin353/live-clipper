appId: com.dingshuxin.venus
productName: Venus
directories:
  output: dist-app
files:
  - main.js
  - preload.js
  - package.json
  - assets/**
extraResources:
  - from: backend-dist/live-clipper-backend
    to: backend
  - from: node_modules/ffmpeg-static/ffmpeg
    to: bin/ffmpeg
  - from: build/app-update.yml
    to: app-update.yml
afterPack: ./scripts/after-pack.js
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.video
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
publish:
  provider: github
  owner: dingshuxin353
  repo: live-clipper
