name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Check desktop JavaScript syntax
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check src/live_clipper/web_static/onboarding.js
      - name: Build package
        run: python -m build
